<div class="toast-stack" aria-live="polite" aria-relevant="additions">
  @for (toast of toastService.messages(); track toast.id) {
    <div class="toast" [class]="'toast ' + toast.kind" role="status">
      <span class="toast-icon"><ng-icon [name]="iconFor(toast.kind)" size="16" aria-hidden="true" /></span>
      <span>{{ toast.message }}</span>
      <button type="button" aria-label="Dismiss notification" (click)="toastService.dismiss(toast.id)">
        <ng-icon name="lucideX" size="15" aria-hidden="true" />
      </button>
    </div>
  }
</div>
