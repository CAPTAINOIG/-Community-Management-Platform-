<div class="dialog-backdrop" role="presentation" (click)="cancelled.emit()">
  <section class="programme-dialog" role="dialog" aria-modal="true" [attr.aria-label]="programme ? 'Edit programme' : 'Create programme'" (click)="$event.stopPropagation()">
    <header class="dialog-header"><div><span class="dialog-kicker">SKILLS & EMPOWERMENT</span><h2>{{ programme ? 'Edit programme' : 'Create a programme' }}</h2><p>Manage learning opportunities for your community.</p></div><button class="close-button" type="button" aria-label="Close form" (click)="cancelled.emit()"><ng-icon name="lucideX" size="18" /></button></header>
    <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <div class="form-grid">
        <label class="form-field full-width"><span>Programme name <b>*</b></span><input formControlName="title" placeholder="e.g. Community leadership lab" />@if (submitted && form.controls.title.invalid) { <small class="field-error">Enter a programme name.</small> }</label>
        <label class="form-field"><span>Category <b>*</b></span><input formControlName="category" placeholder="e.g. Digital inclusion" />@if (submitted && form.controls.category.invalid) { <small class="field-error">Add a programme category.</small> }</label>
        <label class="form-field"><span>Participant capacity <b>*</b></span><input type="number" min="1" max="1000" formControlName="capacity" />@if (submitted && form.controls.capacity.invalid) { <small class="field-error">Capacity must be between 1 and 1,000.</small> }</label>
        <label class="form-field"><span>Starts <b>*</b></span><input type="date" formControlName="startsAt" />@if (submitted && form.controls.startsAt.invalid) { <small class="field-error">Choose a start date.</small> }</label>
        <label class="form-field"><span>Ends <b>*</b></span><input type="date" formControlName="endsAt" />@if (submitted && form.controls.endsAt.invalid) { <small class="field-error">Choose an end date.</small> }</label>
        @if (submitted && form.hasError('endsBeforeStart')) { <small class="field-error full-width" role="alert">The end date must be after the start date.</small> }
        <label class="form-field full-width"><span>Programme status</span><select formControlName="status"><option value="Open">Open for applications</option><option value="In progress">In progress</option><option value="Completed">Completed</option></select></label>
      </div>
      <footer class="dialog-actions"><button class="secondary-button" type="button" (click)="cancelled.emit()">Cancel</button><button class="submit-button" type="submit"><ng-icon name="lucideCheck" size="15" /> {{ programme ? 'Save changes' : 'Create programme' }}</button></footer>
    </form>
  </section>
</div>
